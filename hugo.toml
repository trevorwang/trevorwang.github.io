baseURL = "https://hitrevor.com/"
theme = "PaperMod"

defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false

[languages]
  [languages.zh-cn]
    languageName = "中文"
    languageCode = "zh-CN"
    locale = "zh-CN"
    weight = 1
    contentDir = "content/zh-cn"
    title = "Trevor's Blog"
    [languages.zh-cn.params]
      description = "Fullstack engineer，10 年移动端。写 Kotlin Multiplatform、AI 工具与工程实践。"
      [languages.zh-cn.params.homeInfoParams]
        Title = "Trevor's Blog"
        Content = "写了十年的移动端，现在主要折腾 Kotlin Multiplatform 和 AI 工具。这里的文章大多先在公众号发过，再归档到这里，尽量都带可复现的步骤和一手来源。\n\n手上还长期维护着两个开源项目：retrofit.dart，Dart 的类型安全 REST 客户端生成器，跑在 dio 上，pub.dev 上月下载将近七十万；chatgpt_book_code，掘金小册《Flutter 实战：ChatGPT 客户端开发》的配套代码。版本、数据和来龙去脉都在[项目](/projects/)页。"
    [languages.zh-cn.menu]
      [[languages.zh-cn.menu.main]]
        identifier = "posts"
        name = "文章"
        url = "/posts/"
        weight = 10
      [[languages.zh-cn.menu.main]]
        identifier = "tags"
        name = "标签"
        url = "/tags/"
        weight = 20
      [[languages.zh-cn.menu.main]]
        identifier = "archive"
        name = "归档"
        url = "/archives/"
        weight = 30
      [[languages.zh-cn.menu.main]]
        identifier = "projects"
        name = "项目"
        url = "/projects/"
        weight = 35
      [[languages.zh-cn.menu.main]]
        identifier = "about"
        name = "关于"
        url = "/about/"
        weight = 40

  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    locale = "en-US"
    weight = 2
    contentDir = "content/en"
    title = "Trevor's Blog"
    [languages.en.params]
      description = "Fullstack engineer, ten years in mobile. Writing about Kotlin Multiplatform, AI tooling and engineering practice."
      [languages.en.params.homeInfoParams]
        Title = "Trevor's Blog"
        Content = "Ten years in mobile, now mostly Kotlin Multiplatform and AI tooling. Most posts appear on WeChat first and get archived here, with reproducible steps and primary sources wherever possible.\n\nI also keep two open-source projects going long term: retrofit.dart, a type-safe REST client generator for Dart built on dio with close to 700,000 downloads on pub.dev in the last 30 days; and chatgpt_book_code, the companion code for the Juejin booklet *Flutter in Practice: Building a ChatGPT Client*. Versions, numbers and the story behind each live on the [Projects](/en/projects/) page."
    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "posts"
        name = "Posts"
        url = "/en/posts/"
        weight = 10
      [[languages.en.menu.main]]
        identifier = "tags"
        name = "Tags"
        url = "/en/tags/"
        weight = 20
      [[languages.en.menu.main]]
        identifier = "archive"
        name = "Archive"
        url = "/en/archives/"
        weight = 30
      [[languages.en.menu.main]]
        identifier = "projects"
        name = "Projects"
        url = "/en/projects/"
        weight = 35
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/en/about/"
        weight = 40

[params]
  env = "production"
  author = "Trevor Wang"
  keywords = ["Kotlin", "Kotlin Multiplatform", "Android", "AI Agent", "Flutter"]
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowToc = true
  TocOpen = false
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true
  disableSpecial1stPost = true
  disableScrollToTop = false

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/trevorwang"

  [params.assets]
    favicon = "favicon.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"

[pagination]
  pagerSize = 12

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    codeFences = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[permalinks]
  posts = "/posts/:filename/"
